
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANZA Homestay AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <h2>VANZA</h2>
                <p>Homestay AI Assistant</p>
            </div>

            <button id="newChatBtn" class="new-chat">
                + New Chat
            </button>

            <h3>Previous Conversations</h3>

            <div id="conversationList" class="conversation-list">
            </div>

            <a href="/smartrag" target="_blank" class="documents-link">
                Manage Documents ↗
            </a>
        </aside>

        <main class="main">

            <header class="header">
                <h2>VANZA AI Assistant</h2>
                <span class="status">● Online</span>
            </header>

            <section id="chatMessages" class="messages">
                <div class="welcome">
                    <h1>Welcome to VANZA AI</h1>
                    <p>
                        Ask questions about bookings, guests,
                        rooms, payments and homestay documents.
                    </p>
                </div>
            </section>

            <form id="chatForm" class="chat-form">
                <input type="text"
                       id="messageInput"
                       placeholder="Ask VANZA anything..."
                       autocomplete="off"
                       required>

                <button type="submit" id="sendBtn">
                    Send
                </button>
            </form>

            <p class="footer">
                VANZA Homestay AI · Local AI Assistant
            </p>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
